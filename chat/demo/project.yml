name: ChatDemo
options:
  deploymentTarget:
    iOS: "15.0"
targets:
  ChatDemo:
    type: application
    platform: iOS
    sources:
      - path: ChatDemo/Sources
      - path: ChatDemo/Resources
        buildPhase: resources
      - path: ChatDemo/Configuration/appConfig.json
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: ChatDemo/Configuration/Info.plist
        PRODUCT_NAME: ChatDemo
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.tencent.tuikit.demo.xa.uikit
          CODE_SIGN_ENTITLEMENTS: ChatDemo/Configuration/ChatDemo-Debug.entitlements
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.imchat.imchat.uikit
          CODE_SIGN_ENTITLEMENTS: ChatDemo/Configuration/ChatDemo-Release.entitlements